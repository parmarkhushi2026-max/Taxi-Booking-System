{% extends 'core/base.html' %}

{% block title %}Taxi Booking System{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container text-center py-5">
        <div class="card-custom p-5 mx-auto" style="max-width: 600px;">
            <div class="d-inline-flex p-3 rounded-4 bg-taxi-yellow mb-4">
                <i class="bi bi-taxi-front-fill fs-1 text-dark"></i>
            </div>
            <h1 class="fw-bold mb-2">Taxi Booking System</h1>
            <p class="text-secondary mb-4">
                Online taxi dispatch and booking management portal. Powered by Django and SQLite3.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'admin_login' %}" class="btn btn-taxi px-4 py-2">
                    <i class="bi bi-shield-lock-fill me-1"></i> Admin Login
                </a>
                <a href="/admin/" class="btn btn-outline-secondary px-4 py-2" target="_blank">
                    <i class="bi bi-gear-fill me-1"></i> Django Backend
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
